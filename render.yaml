services:
  - type: web
    name: oracle-stack-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run lint && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_PUBLIC_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: NEXT_PUBLIC_WC_PROJECT_ID
        sync: false
